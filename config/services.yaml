services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Lexio\AdminBundle\:
        resource: '../src/'
        exclude:
            - '../src/LexioAdminBundle.php'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Contract/Translation/TranslationCatalogException.php'
            - '../src/Contract/Translation/TranslationCatalogInterface.php'
            - '../src/Contract/Translation/TranslationEntry.php'
            - '../src/Contract/Translation/TranslationFile.php'
            - '../src/Contract/Translation/TranslationPackageMergeResult.php'
            - '../src/Contract/Translation/TranslationPackageSynchronizerInterface.php'
            - '../src/Contract/Translation/TranslationSynchronizationException.php'
            - '../src/Service/Translation/InvalidTranslationDocumentException.php'
            - '../src/Service/Translation/TranslationCacheException.php'
            - '../src/Service/Translation/TranslationStorageException.php'
            - '../src/Filter/'
            - '../src/DependencyInjection/'
            - '../src/Event/'
            - '../src/Controller/'
            - '../src/Message/'
            - '../src/Command/MakeAdminSectionCommand.php'
            - '../src/Command/UploadTranslationsCommand.php'
            - '../src/Command/DownloadTranslationsCommand.php'
            - '../src/Command/ProdDeployCommand.php'
            - '../src/Contract/Deployment/'
            - '../src/Service/Deployment/'
            # Abstract component base classes — excluded so autoconfigure tags are not applied
            - '../src/Component/Admin/AbstractExportExcel.php'
            - '../src/Component/AbstractImageSelector.php'

    # Controllers are public
    Lexio\AdminBundle\Controller\:
        resource: '../src/Controller/'
        exclude:
            - '../src/Controller/Admin/UpdateTranslationInput.php'
        tags: ['controller.service_arguments']
        public: true

    Lexio\AdminBundle\Controller\Admin\MenuController:
        arguments:
            $locales: '%lexio_admin.locales%'

    Lexio\AdminBundle\Contract\Page\PageAdministrationInterface:
        alias: Lexio\AdminBundle\Page\PageManager

    Lexio\AdminBundle\Contract\Mail\MailSenderInterface:
        alias: Lexio\AdminBundle\Mail\MailSender

    Lexio\AdminBundle\Contract\Mail\MailTemplateRepositoryInterface:
        alias: Lexio\AdminBundle\Repository\MailTemplateRepository

    # Core services bound to bundle parameters
    Lexio\AdminBundle\AdminCore\AdminUrlGenerator:
        arguments:
            $defaultLocale: '%lexio_admin.default_locale%'
        shared: false

    Lexio\AdminBundle\AdminCore\FormContext:
        arguments:
            $locales: '%lexio_admin.locales%'
            $defaultLocale: '%lexio_admin.default_locale%'
            $translationDomain: '%lexio_admin.ui.translation_domain%'
        shared: false

    Lexio\AdminBundle\AdminCore\Breadcrumbs\AdminBreadcrumbs:
        arguments:
            $translationDomain: '%lexio_admin.ui.translation_domain%'

    Lexio\AdminBundle\AdminCore\Fields\HasRegisteredField:
        arguments:
            $userEntityClass: '%lexio_admin.user_entity_class%'

    Lexio\AdminBundle\Form\CustomFields\TurnstileType:
        arguments:
            $turnstileKey: '%env(default::TURNSTILE_KEY)%'
        tags: ['form.type']

    Lexio\AdminBundle\Form\CustomFields\CaptchaType:
        arguments:
            $defaultSiteKey: '%env(default::GOOGLE_RECAPTCHA_SITE_KEY)%'
        tags: ['form.type']

    Lexio\AdminBundle\Form\CustomFields\CKEditorType:
        arguments:
            $uploadRouteName: '%lexio_admin.ui.routes.ckeditor_upload%'
        tags: ['form.type']

    Lexio\AdminBundle\Form\CustomFields\InputImageSelectorType:
        arguments:
            $translationDomain: '%lexio_admin.ui.translation_domain%'
        tags: ['form.type']

    Lexio\AdminBundle\Form\CustomFields\VanillaDatepickerType:
        arguments:
            $defaultLocale: '%lexio_admin.default_locale%'
        tags: ['form.type']

    Lexio\AdminBundle\Component\Admin\ToggleSwitcher:
        arguments:
            $translationDomain: '%lexio_admin.ui.translation_domain%'

    Lexio\AdminBundle\Component\Admin\InputImageSelector:
        autoconfigure: false
        tags:
            - { name: twig.component, key: 'Admin:InputImageSelector', template: '@LexioAdmin/components/Admin/InputImageSelector.html.twig' }

    Lexio\AdminBundle\AdminCore\Resolver\MapQueryStringValueResolver:
        tags:
            - { name: kernel.event_subscriber }

    Lexio\AdminBundle\AdminCore\RouteLoader:
        public: true

    Lexio\AdminBundle\Service\EntityFilterer:
        public: true

    Lexio\AdminBundle\Service\Translation\YamlTranslationCatalog:
        arguments:
            $translationDirectory: '%lexio_admin.translation_directory%'
            $enabled: '%lexio_admin.translation_management_enabled%'

    Lexio\AdminBundle\Service\Translation\TranslationSynchronizationOptions:
        arguments:
            $enabled: '%lexio_admin.translation_synchronization_enabled%'
            $environment: '%kernel.environment%'
            $appSecret: '%kernel.secret%'
            $deployedAppUrl: '%lexio_admin.translation_synchronization_deployed_app_url%'
            $apiPath: '%lexio_admin.translation_synchronization_api_path%'
            $authSalt: '%lexio_admin.translation_synchronization_auth_salt%'
            $signatureTtl: '%lexio_admin.translation_synchronization_signature_ttl%'
            $timeout: '%lexio_admin.translation_synchronization_timeout%'
            $maxPackageBytes: '%lexio_admin.translation_synchronization_max_package_bytes%'
            $maxFiles: '%lexio_admin.translation_synchronization_max_files%'
            $basicAuthUsername: '%lexio_admin.translation_synchronization_basic_auth_username%'
            $basicAuthPassword: '%lexio_admin.translation_synchronization_basic_auth_password%'

    Lexio\AdminBundle\Service\Translation\TranslationPackageManager:
        arguments:
            $translationDirectory: '%lexio_admin.translation_directory%'

    Lexio\AdminBundle\Service\Translation\TranslationCacheClearer:
        arguments:
            $cacheDirectory: '%kernel.cache_dir%'

    Lexio\AdminBundle\Contract\Translation\TranslationCatalogInterface:
        alias: Lexio\AdminBundle\Service\Translation\YamlTranslationCatalog

    Lexio\AdminBundle\Contract\Translation\TranslationPackageSynchronizerInterface:
        alias: Lexio\AdminBundle\Service\Translation\TranslationPackageSynchronizer

    # SSH deployment
    Lexio\AdminBundle\Service\Deployment\DeploymentOptions:
        arguments:
            $enabled: '%lexio_admin.deployment.enabled%'
            $host: '%lexio_admin.deployment.host%'
            $user: '%lexio_admin.deployment.user%'
            $port: '%lexio_admin.deployment.port%'
            $remotePath: '%lexio_admin.deployment.remote_path%'
            $deployScript: '%lexio_admin.deployment.deploy_script%'
            $identityFile: '%lexio_admin.deployment.identity_file%'
            $timeout: '%lexio_admin.deployment.timeout%'

    Lexio\AdminBundle\Service\Deployment\DeploymentConfigurationValidator: ~

    Lexio\AdminBundle\Service\Deployment\SshCommandBuilder: ~

    Lexio\AdminBundle\Service\Deployment\SymfonyProcessRunner: ~

    Lexio\AdminBundle\Service\Deployment\SshDeploymentRunner: ~

    Lexio\AdminBundle\Contract\Deployment\DeploymentRunnerInterface:
        alias: Lexio\AdminBundle\Service\Deployment\SshDeploymentRunner

    Lexio\AdminBundle\Service\Deployment\ProcessRunnerInterface:
        alias: Lexio\AdminBundle\Service\Deployment\SymfonyProcessRunner

    Lexio\AdminBundle\Command\UploadTranslationsCommand:
        autoconfigure: false
        tags:
            - { name: console.command, command: lexio:translations:upload }

    Lexio\AdminBundle\Command\DownloadTranslationsCommand:
        autoconfigure: false
        tags:
            - { name: console.command, command: lexio:translations:download }

    Lexio\AdminBundle\Command\ProdDeployCommand:
        autoconfigure: false
        tags:
            - { name: console.command, command: prod:deploy }

    # Twig extensions
    Lexio\AdminBundle\Twig\AdminExtension:
        arguments:
            $frontHomePageRoute: '%lexio_admin.front_home_page_route%'
            $ui: '%lexio_admin.ui%'
        tags: ['twig.extension']

    Lexio\AdminBundle\Twig\AppExtension:
        arguments:
            $siteBaseUrl: '%env(SITE_BASE_URL)%'
            $locales: '%lexio_admin.locales%'

    # AutoTranslator
    Lexio\AdminBundle\Service\AutoTranslator\EntityAutoTranslator:
        arguments:
            $defaultLocale: '%lexio_admin.default_locale%'
            $locales: '%lexio_admin.locales%'

    Lexio\AdminBundle\Page\PageManager:
      $manager: '@doctrine.orm.entity_manager'
      $autoTranslator: '@Lexio\AdminBundle\Service\AutoTranslator\EntityAutoTranslator'
      $defaultLocale: '%lexio_admin.default_locale%'

    # ImageCacheResolver — needs %kernel.project_dir%
    Lexio\AdminBundle\File\ImageCacheResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FileManager — needs %kernel.project_dir% and SITE_BASE_URL; Filesystem is autowired
    Lexio\AdminBundle\File\FileManager:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $siteBaseUrl: '%env(SITE_BASE_URL)%'

    Lexio\AdminBundle\EventListener\FileEventListener:
        tags:
            - { name: doctrine.event_listener, event: postRemove, priority: 500, connection: default }

